<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tailwind cli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">

    <!-- Login Form Container -->
    <div class="bg-amber-200 p-8 rounded-lg w-full max-w-sm shadow-2xl">
        <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">Login to Your Account</h2>

        <!-- Form Fields -->
        <form class="space-y-6">
            <!-- Email Field -->
            <div>
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" required class="form-input" placeholder="you@example.com">
              </div>
              
              <div>
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" required class="form-input" placeholder="Enter your password">
              </div>
            <!-- Remember Me & Forgot Password -->
            <div class="flex items-center justify-between">
                <label class="flex items-center">
                    <input type="checkbox" class="text-blue-600 focus:ring-0 rounded">
                    <span class="ml-2 text-sm text-gray-600">Remember me</span>
                </label>
                <a href="#" class="text-sm text-blue-500 hover:underline">Forgot password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full px-4 py-2 mt-4 font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-50">
                Log In
            </button>
        </form>

        <!-- Divider -->
        <div class="mt-6 border-t"></div>

        <!-- Sign Up Option -->
        <p class="text-sm text-center text-gray-600 mt-4">
            Don’t have an account?
            <a href="#" class="text-blue-500 hover:underline">Sign up</a>
        </p>
    </div>

</body>
</html>
